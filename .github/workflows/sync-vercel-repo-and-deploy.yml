# Canonical repo: rehearse2026/Rehearse (push here)
# Mirror target: rehearse2026/rehearse2026 (Vercel-connected private repo)
# Deploy: Vercel CLI with owner token (bypasses Hobby "commit author" git blocks)
#
# Required GitHub secrets (Settings → Secrets → Actions):
#   VERCEL_TOKEN          — Vercel account token (team owner)
#   VERCEL_ORG_ID         — Vercel team id
#   VERCEL_PROJECT_ID     — Vercel project id
#   VERCEL_REPO_SYNC_TOKEN — GitHub PAT (rehearse2026 owner) with repo write on rehearse2026/rehearse2026

name: Sync Vercel repo and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require Vercel deploy secrets
        run: |
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub secret: $name — add it under repo Settings → Secrets → Actions"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Mirror main to Vercel private repo
        env:
          SYNC_TOKEN: ${{ secrets.VERCEL_REPO_SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "VERCEL_REPO_SYNC_TOKEN not set — skipping mirror."
            exit 0
          fi
          git remote add vercel-private "https://x-access-token:${SYNC_TOKEN}@github.com/rehearse2026/rehearse2026.git"
          git push vercel-private HEAD:main --force

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel env
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
